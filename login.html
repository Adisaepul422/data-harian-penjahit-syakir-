<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Login - Sistem Produksi syakirFamilia</title>
<link rel="stylesheet" href="shared.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js" onerror="document.write('<script src=\'https://cdnjs.cloudflare.com/ajax/libs/firebase/10.12.2/firebase-app-compat.min.js\'><\/script>')"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js" onerror="document.write('<script src=\'https://cdnjs.cloudflare.com/ajax/libs/firebase/10.12.2/firebase-firestore-compat.min.js\'><\/script>')"></script>
<script>
  window.addEventListener('DOMContentLoaded', function () {
    if (typeof firebase === 'undefined') {
      document.body.insertAdjacentHTML('afterbegin',
        '<div style="position:fixed;top:0;left:0;right:0;background:#ef4444;color:#fff;padding:12px 16px;text-align:center;font-size:13px;font-weight:600;z-index:9999;">⚠️ Gagal memuat library Firebase. Cek koneksi internet, matikan AdBlock/VPN, atau coba jaringan lain.</div>');
    }
  });
</script>
</head>
<body>
<div id="page-login" class="page active">
  <div class="login-card">
    <div class="login-logo">
      <img src="Logo.jpeg" alt="Logo SyakirFamilia" class="login-logo-img">
      <h1>Sistem Produksi</h1>
      <p>Manajemen Data Harian Pekerja</p>
    </div>
    <div class="login-err" id="login-err">Username atau password salah.</div>
    <div class="form-group">
      <label>Username</label>
      <input type="text" id="inp-user" placeholder="Masukkan username..." autocomplete="off">
    </div>
    <div class="form-group">
      <label>Password</label>
      <input type="password" id="inp-pass" placeholder="Masukkan password...">
    </div>
    <button class="btn btn-primary" onclick="doLogin()">🔐 Masuk</button>
  </div>
</div>


<div class="toast" id="toast"></div>

<script src="shared.js"></script>
<script src="login.js"></script>
</body>
</html>
