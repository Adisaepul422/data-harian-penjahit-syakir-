<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Input Produksi Harian - syakirFamilia</title>
<link rel="stylesheet" href="shared.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js" onerror="document.write('<script src=\'https://cdnjs.cloudflare.com/ajax/libs/firebase/10.12.2/firebase-app-compat.min.js\'><\/script>')"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js" onerror="document.write('<script src=\'https://cdnjs.cloudflare.com/ajax/libs/firebase/10.12.2/firebase-firestore-compat.min.js\'><\/script>')"></script>
<script>
  window.addEventListener('DOMContentLoaded', function () {
    if (typeof firebase === 'undefined') {
      document.body.insertAdjacentHTML('afterbegin',
        '<div style="position:fixed;top:0;left:0;right:0;background:#ef4444;color:#fff;padding:12px 16px;text-align:center;font-size:13px;font-weight:600;z-index:9999;">⚠️ Gagal memuat library Firebase. Cek koneksi internet, matikan AdBlock/VPN, atau coba jaringan lain.</div>');
    }
  });
</script>
</head>
<body>
<div id="page-produksi" class="page">
  <div class="topbar">
    <div class="topbar-left">
      <img src="Logo.jpeg" alt="Logo SyakirFamilia" class="topbar-logo">
      <h2>Produksi Harian</h2>
      <span class="topbar-badge">Tim Produksi</span>
    </div>
    <div class="topbar-right">
      <span class="conn-badge" id="conn-badge-produksi"><span class="conn-dot"></span><span class="conn-text">Online</span></span>
      <span class="topbar-date" id="prod-date"></span>
      <button class="btn-logout" onclick="doLogout()">Keluar</button>
    </div>
  </div>

  <div class="main-wrap">
    <!-- Pendapatan Saya -->
    <div class="card" id="pendapatan-card">
      <div class="card-title"><span class="dot" style="background:var(--success)"></span>💰 Pendapatan Saya</div>
      <div id="pendapatan-loading" class="loading-state">
        <div class="dot-flash"><span></span><span></span><span></span></div>
        <p>Menghitung pendapatan...</p>
      </div>
      <div id="pendapatan-content" style="display:none;">
        <div style="text-align:center; padding: 4px 0 14px;">
          <div style="font-size:12px;color:var(--muted);margin-bottom:4px;" id="pendapatan-periode"></div>
          <div style="font-size:30px;font-weight:800;color:var(--success);" id="pendapatan-total">Rp0</div>
          <div style="font-size:12px;color:var(--muted);margin-top:2px;" id="pendapatan-qty">0 Lusin</div>
        </div>
        <div id="pendapatan-warning" style="display:none; background:#fef3c7;color:#92400e;font-size:11px;padding:8px 10px;border-radius:8px;margin-bottom:12px;"></div>
        <button class="btn btn-outline" style="width:100%;" onclick="toggleRiwayatPendapatan()">📜 <span id="riwayat-toggle-text">Lihat Riwayat Minggu Lalu</span></button>
        <div id="riwayat-pendapatan" style="display:none; margin-top:14px;">
          <div class="table-wrap">
            <table>
              <thead><tr><th>Periode</th><th>Lusin</th><th>Pendapatan</th></tr></thead>
              <tbody id="riwayat-tbody"></tbody>
            </table>
          </div>
        </div>
      </div>
    </div>

    <div class="card">
      <div class="card-title"><span class="dot"></span>Input Data Produksi</div>
      <div class="form-group">
        <label>Nama Pekerja</label>
        <input type="text" id="inp-nama" readonly style="background:#f1f5f9;color:var(--muted);cursor:not-allowed;">
      </div>
      <div class="form-row">
        <div class="form-group">
          <label>Nama Barang</label>
          <select id="inp-barang" onchange="loadWarna()">
            <option value="">-- Pilih Barang --</option>
          </select>
        </div>
        <div class="form-group">
          <label>Warna</label>
          <select id="inp-warna">
            <option value="">-- Pilih Warna --</option>
          </select>
        </div>
      </div>
      <div class="form-row">
        <div class="form-group">
          <label>Jumlah</label>
          <input type="number" id="inp-jumlah" placeholder="0" min="1">
        </div>
        <div class="form-group">
          <label>Satuan</label>
          <select id="inp-satuan">
            <option value="Lusin">Lusin</option>
            <option value="Pcs">Pcs</option>
          </select>
        </div>
      </div>
      <div class="form-group" id="wrap-inp-bahan" style="display:none;">
        <label>Penggunaan Bahan</label>
        <input type="text" id="inp-bahan" placeholder="Contoh: Ayumi 1 Roll, Jeung naon weh nu lainna">
      </div>
      <div class="btn-row">
        <button class="btn btn-add" onclick="tambahKePreview()">➕ Tambah</button>
      </div>

      <div id="preview-section" style="margin-top:20px; display:none;">
        <div class="card-title" style="margin-bottom:10px;"><span class="dot" style="background:var(--accent)"></span>Preview — Belum Disimpan</div>
        <div id="preview-list" class="preview-list"></div>
        <div class="btn-row" style="margin-top:16px;">
          <button class="btn btn-primary" id="btn-simpan-semua" onclick="simpanSemua()">✅ Simpan Semua</button>
          <button class="btn btn-danger" onclick="batalSemua()">🗑️ Batal Semua</button>
        </div>
      </div>
    </div>

  </div>
</div>


<div class="toast" id="toast"></div>

<script src="shared.js"></script>
<script src="produksi.js"></script>
</body>
</html>
